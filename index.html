<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyWoven-Clothes™ | Premium Online Store</title>
    <style>
        :root {
            --bg-color: #faf8f5;
            --card-bg: #ffffff;
            --text-color: #2c2c2c;
            --primary-color: #111111;
            --accent-color: #b89753;
            --border-color: #eae6df;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); }

        /* Top Announcement Bar */
        .top-bar { background: var(--primary-color); color: #fff; text-align: center; padding: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; }

        /* Header Navigation */
        header { background: #fff; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; }
        .logo { font-size: 22px; font-weight: 900; letter-spacing: 1px; color: var(--primary-color); text-transform: uppercase; }
        .logo span { color: var(--accent-color); }
        .nav-search { display: flex; gap: 10px; flex: 1; max-width: 400px; margin: 0 30px; }
        .nav-search input { width: 100%; padding: 8px 14px; border: 1px solid var(--border-color); border-radius: 20px; outline: none; font-size: 13px; background: #faf8f5; }
        .cart-icon-btn { background: var(--primary-color); color: #fff; border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; }

        /* Categories Bar */
        .categories-nav { display: flex; justify-content: center; gap: 15px; padding: 12px; background: #fff; border-bottom: 1px solid var(--border-color); overflow-x: auto; white-space: nowrap; }
        .cat-btn { background: transparent; border: none; font-size: 13px; font-weight: 600; color: #555; cursor: pointer; padding: 6px 14px; border-radius: 15px; transition: 0.2s; }
        .cat-btn:hover, .cat-btn.active { background: var(--primary-color); color: #fff; }

        /* Hero Banner */
        .hero-banner { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat; color: #fff; text-align: center; padding: 70px 20px; margin-bottom: 30px; }
        .hero-banner h1 { font-size: 32px; font-weight: 900; margin-bottom: 10px; letter-spacing: 1px; }
        .hero-banner p { font-size: 14px; opacity: 0.9; margin-bottom: 20px; }

        /* Products Grid */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .product-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; transition: 0.3s; display: flex; flex-direction: column; cursor: pointer; position: relative; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.06); }
        .product-img-wrap { width: 100%; height: 280px; background: #f4f1ea; overflow: hidden; position: relative; }
        .product-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .discount-badge { position: absolute; top: 10px; left: 10px; background: #e74c3c; color: #fff; font-size: 10px; font-weight: bold; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }
        .product-info { padding: 14px; display: flex; flex-direction: column; flex: 1; }
        .product-cat { font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 4px; font-weight: bold; }
        .product-title { font-size: 14px; font-weight: 700; color: var(--primary-color); margin-bottom: 8px; }
        .product-price { font-size: 15px; font-weight: 900; color: var(--accent-color); margin-bottom: 12px; }
        .card-actions { display: flex; gap: 8px; margin-top: auto; }
        .btn-action { flex: 1; padding: 8px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; border: none; text-align: center; }
        .btn-add-bag { background: #f4f1ea; color: var(--primary-color); border: 1px solid var(--border-color); }
        .btn-buy-now { background: var(--primary-color); color: #fff; }

        /* Modal Details */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 15px; }
        .modal-content { background: #fff; width: 100%; max-width: 800px; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; max-height: 90vh; }
        .modal-body { display: flex; flex-wrap: wrap; overflow-y: auto; padding: 25px; gap: 25px; }
        .modal-images { flex: 1; min-width: 280px; }
        .main-zoom-img { width: 100%; height: 320px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 10px; }
        .thumb-row { display: flex; gap: 8px; overflow-x: auto; }
        .thumb-row img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border-color); cursor: pointer; }
        .modal-details { flex: 1; min-width: 280px; }
        .close-modal { background: none; border: none; font-size: 22px; cursor: pointer; float: right; font-weight: bold; }

        /* Bag / Checkout Drawer */
        .drawer { position: fixed; top: 0; right: -400px; width: 380px; height: 100%; background: #fff; box-shadow: -5px 0 25px rgba(0,0,0,0.1); z-index: 3000; transition: 0.3s; display: flex; flex-direction: column; padding: 20px; }
        .drawer.open { right: 0; }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 15px; }
        .drawer-items { flex: 1; overflow-y: auto; margin-bottom: 15px; }
        .drawer-footer { border-top: 1px solid var(--border-color); padding-top: 15px; }
        .checkout-input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px; background: #faf8f5; }
        .btn-whatsapp-checkout { background: #25d366; color: #fff; border: none; width: 100%; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }

        @media(max-width: 768px) {
            header { padding: 12px 15px; }
            .nav-search { display: none; }
            .modal-body { flex-direction: column; }
            .drawer { width: 100%; right: -100%; }
            .drawer.open { right: 0; }
        }
    </style>
</head>
<body>

    <div class="top-bar">✨ Welcome to SkyWoven-Clothes™ | Premium Fashion & Lifestyle 🚚</div>

    <header>
        <div class="logo">SkyWoven<span>-Clothes</span></div>
        <div class="nav-search">
            <input type="text" id="searchInput" placeholder="Search clothes, shoes, cosmetics..." onkeyup="filterProducts()">
        </div>
        <button class="cart-icon-btn" onclick="toggleCartDrawer()">🛒 Bag (<span id="cartCount">0</span>)</button>
    </header>

    <div class="categories-nav">
        <button class="cat-btn active" onclick="filterCategory('All')">All Collection</button>
        <button class="cat-btn" onclick="filterCategory('Men')">Men</button>
        <button class="cat-btn" onclick="filterCategory('Women')">Women</button>
        <button class="cat-btn" onclick="filterCategory('Boys')">Boys</button>
        <button class="cat-btn" onclick="filterCategory('Girls')">Girls</button>
        <button class="cat-btn" onclick="filterCategory('Home')">Home</button>
        <button class="cat-btn" onclick="filterCategory('Brand')">Brand</button>
        <button class="cat-btn" onclick="filterCategory('Cosmetic')">Cosmetic</button>
    </div>

    <div class="hero-banner">
        <h1>Redefining Modern Fashion</h1>
        <p>Explore exclusive styles crafted for elegance and everyday comfort.</p>
    </div>

    <div class="container">
        <div id="productsGrid" class="products-grid">
            <p style="text-align:center; grid-column: 1/-1; padding: 40px; color:#777;">Loading collection from database...</p>
        </div>
    </div>

    <!-- Product View Modal -->
    <div id="productModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div style="padding: 15px 20px; border-bottom: 1px solid var(--border-color);">
                <button class="close-modal" onclick="closeProductModal()">×</button>
                <h3 id="modalTitle" style="font-size: 18px;">Product Details</h3>
            </div>
            <div class="modal-body">
                <div class="modal-images">
                    <img id="modalMainImg" src="" class="main-zoom-img" alt="Product">
                    <div id="modalThumbs" class="thumb-row"></div>
                </div>
                <div class="modal-details">
                    <div id="modalCat" style="font-size: 12px; color:#777; font-weight:bold; margin-bottom:5px;"></div>
                    <div id="modalPrice" style="font-size: 20px; font-weight: 900; color: var(--accent-color); margin-bottom: 12px;"></div>
                    <div style="margin-bottom: 12px;">
                        <label style="font-size: 12px; font-weight: bold; display:block; margin-bottom:4px;">Select Size:</label>
                        <select id="modalSizeSelect" class="checkout-input" style="width:120px;">
                            <option value="Standard">Standard</option>
                            <option value="Small">Small (S)</option>
                            <option value="Medium">Medium (M)</option>
                            <option value="Large">Large (L)</option>
                            <option value="XL">Extra Large (XL)</option>
                        </select>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label style="font-size: 12px; font-weight: bold; display:block; margin-bottom:4px;">Quantity:</label>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <button onclick="adjustModalQty(-1)" style="width:30px; height:30px; font-weight:bold; cursor:pointer;">-</button>
                            <span id="modalQtyVal" style="font-weight:bold; font-size:15px;">1</span>
                            <button onclick="adjustModalQty(1)" style="width:30px; height:30px; font-weight:bold; cursor:pointer;">+</button>
                        </div>
                    </div>
                    <p id="modalDesc" style="font-size: 13px; color: #555; line-height: 1.5; margin-bottom: 20px;"></p>
                    <button class="btn-action btn-buy-now" style="padding: 12px; font-size: 14px; width:100%;" onclick="addCurrentToBagAndOpen()">Add to Bag & Checkout</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Shopping Bag & Checkout Drawer -->
    <div id="cartDrawer" class="drawer">
        <div class="drawer-header">
            <h3>Your Shopping Bag</h3>
            <button onclick="toggleCartDrawer()" style="background:none; border:none; font-size:20px; cursor:pointer; font-weight:bold;">×</button>
        </div>
        <div id="drawerItemsList" class="drawer-items">
            <p style="text-align:center; color:#777; margin-top:30px;">Your bag is empty.</p>
        </div>
        <div class="drawer-footer">
            <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-weight:bold; font-size:15px;">
                <span>Total Amount:</span>
                <span id="drawerTotalPrice" style="color:var(--accent-color);">Rs. 0</span>
            </div>
            <input type="text" id="custName" class="checkout-input" placeholder="Your Full Name">
            <input type="tel" id="custPhone" class="checkout-input" placeholder="Phone Number (e.g. 03XXXXXXXXX)">
            <input type="text" id="custAddress" class="checkout-input" placeholder="Delivery House / Street Address">
            <select id="custCity" class="checkout-input" onchange="updateCartTotal()">
                <option value="Karachi">Karachi (Delivery: Rs. 200)</option>
                <option value="Other Cities">Other Cities (Delivery: Rs. 350)</option>
            </select>
            <button class="btn-whatsapp-checkout" onclick="checkoutOnWhatsApp()">💬 Checkout on WhatsApp</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDVPc78lc2oMcyWK381kw_Pm5tYgGjOw0s",
            authDomain: "skywoven-clothing.firebaseapp.com",
            projectId: "skywoven-clothing",
            storageBucket: "skywoven-clothing.firebasestorage.app",
            messagingSenderId: "853346979378",
            appId: "1:853346979378:web:25b39032cf23439a57f62b",
            measurementId: "G-48T1R8KZ4F"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.allProducts = [];
        window.cart = [];
        window.currentSelectedProduct = null;
        window.selectedQty = 1;

        async function fetchCustomerProducts() {
            let grid = document.getElementById('productsGrid');
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                window.allProducts = [];
                querySnapshot.forEach((docSnap) => {
                    window.allProducts.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderProducts(window.allProducts);
            } catch (e) {
                grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#e74c3c;">Failed to load products. Please check internet.</p>';
            }
        }
        fetchCustomerProducts();

        window.renderProducts = function(list) {
            let grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            if(list.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#777; padding:40px;">No products found in this category.</p>';
                return;
            }
            list.forEach(p => {
                let badge = p.discount ? `<div class="discount-badge">${p.discount}</div>` : '';
                let mainImg = p.image || (p.images && p.images[0]) || '';
                grid.innerHTML += `
                    <div class="product-card" onclick="openProductModal('${p.id}')">
                        <div class="product-img-wrap">
                            ${badge}
                            <img src="${mainImg}" alt="${p.name}">
                        </div>
                        <div class="product-info">
                            <span class="product-cat">${p.category} > ${p.subCategory || 'General'}</span>
                            <div class="product-title">${p.name}</div>
                            <div class="product-price">Rs. ${p.rawPrice}</div>
                            <div class="card-actions" onclick="event.stopPropagation()">
                                <button class="btn-action btn-add-bag" onclick="quickAddToCart('${p.id}')">Add to Bag</button>
                                <button class="btn-action btn-buy-now" onclick="openProductModal('${p.id}')">Buy Now</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        window.filterCategory = function(cat) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            if(cat === 'All') renderProducts(window.allProducts);
            else {
                let filtered = window.allProducts.filter(p => p.category.toLowerCase() === cat.toLowerCase());
                renderProducts(filtered);
            }
        }

        window.filterProducts = function() {
            let q = document.getElementById('searchInput').value.toLowerCase();
            let filtered = window.allProducts.filter(p => p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q) || (p.subCategory && p.subCategory.toLowerCase().includes(q)));
            renderProducts(filtered);
        }

        window.openProductModal = function(id) {
            let p = window.allProducts.find(x => x.id === id);
            if(!p) return;
            window.currentSelectedProduct = p;
            window.selectedQty = 1;
            document.getElementById('modalQtyVal').innerText = '1';
            document.getElementById('modalTitle').innerText = p.name;
            document.getElementById('modalCat').innerText = `${p.category} > ${p.subCategory || 'General'}`;
            document.getElementById('modalPrice').innerText = `Rs. ${p.rawPrice}`;
            document.getElementById('modalDesc').innerText = p.details || 'No description provided.';
            
            let mainImg = p.image || (p.images && p.images[0]) || '';
            document.getElementById('modalMainImg').src = mainImg;

            let thumbsContainer = document.getElementById('modalThumbs');
            thumbsContainer.innerHTML = '';
            if(p.images && p.images.length > 0) {
                p.images.forEach(img => {
                    thumbsContainer.innerHTML += `<img src="${img}" onclick="document.getElementById('modalMainImg').src='${img}'">`;
                });
            }
            document.getElementById('productModal').style.display = 'flex';
        }

        window.closeProductModal = function() {
            document.getElementById('productModal').style.display = 'none';
        }

        window.adjustModalQty = function(val) {
            window.selectedQty += val;
            if(window.selectedQty < 1) window.selectedQty = 1;
            document.getElementById('modalQtyVal').innerText = window.selectedQty;
        }

        window.quickAddToCart = function(id) {
            let p = window.allProducts.find(x => x.id === id);
            if(!p) return;
            addToCartObject(p, 'Standard', 1);
        }

        window.addCurrentToBagAndOpen = function() {
            if(!window.currentSelectedProduct) return;
            let size = document.getElementById('modalSizeSelect').value;
            addToCartObject(window.currentSelectedProduct, size, window.selectedQty);
            closeProductModal();
            toggleCartDrawer();
        }

        function addToCartObject(product, size, qty) {
            let existing = window.cart.find(item => item.id === product.id && item.size === size);
            if(existing) {
                existing.qty += qty;
            } else {
                window.cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.rawPrice,
                    size: size,
                    qty: qty,
                    image: product.image || (product.images && product.images[0]) || ''
                });
            }
            updateCartUI();
            alert("✓ Product added to shopping bag!");
        }

        window.toggleCartDrawer = function() {
            document.getElementById('cartDrawer').classList.toggle('open');
        }

        window.updateCartUI = function() {
            let totalCount = window.cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartCount').innerText = totalCount;
            
            let listDiv = document.getElementById('drawerItemsList');
            if(window.cart.length === 0) {
                listDiv.innerHTML = '<p style="text-align:center; color:#777; margin-top:30px;">Your bag is empty.</p>';
                document.getElementById('drawerTotalPrice').innerText = 'Rs. 0';
                return;
            }

            listDiv.innerHTML = '';
            window.cart.forEach((item, index) => {
                listDiv.innerHTML += `
                    <div style="display:flex; gap:10px; align-items:center; margin-bottom:12px; border-bottom:1px solid #eee; padding-bottom:10px;">
                        <img src="${item.image}" style="width:50px; height:50px; object-fit:cover; border-radius:4px;">
                        <div style="flex:1;">
                            <div style="font-size:13px; font-weight:bold;">${item.name}</div>
                            <div style="font-size:11px; color:#555;">Size: ${item.size} | Qty: ${item.qty}</div>
                            <div style="font-size:13px; font-weight:900; color:var(--accent-color);">Rs. ${item.price * item.qty}</div>
                        </div>
                        <button onclick="removeCartItem(${index})" style="background:#e74c3c; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:11px;">X</button>
                    </div>
                `;
            });
            updateCartTotal();
        }

        window.removeCartItem = function(index) {
            window.cart.splice(index, 1);
            updateCartUI();
        }

        window.updateCartTotal = function() {
            let subtotal = window.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            let city = document.getElementById('custCity').value;
            let delivery = city === 'Karachi' ? 200 : 350;
            let grandTotal = subtotal > 0 ? subtotal + delivery : 0;
            document.getElementById('drawerTotalPrice').innerText = `Rs. ${grandTotal}`;
        }

        window.checkoutOnWhatsApp = async function() {
            if(window.cart.length === 0) return alert("Your bag is empty!");
            let name = document.getElementById('custName').value.trim();
            let phone = document.getElementById('custPhone').value.trim();
            let address = document.getElementById('custAddress').value.trim();
            let city = document.getElementById('custCity').value;

            if(!name || !phone || !address) return alert("Please fill in your Name, Phone, and Delivery Address!");

            let itemsSummary = window.cart.map(i => `• ${i.name} (Size: ${i.size}) x ${i.qty} = Rs. ${i.price * i.qty}`).join('\n');
            let subtotal = window.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            let delivery = city === 'Karachi' ? 200 : 350;
            let total = subtotal + delivery;

            let orderDetailsText = `${itemsSummary}\nDelivery Fee (${city}): Rs. ${delivery}\n*Grand Total: Rs. ${total}*`;

            try {
                await addDoc(collection(db, "orders"), {
                    name, phone, address, city,
                    details: orderDetailsText,
                    totalAmount: total,
                    status: "Pending",
                    timestamp: new Date().toISOString()
                });
            } catch(e) { console.error("Database order save note:", e); }

            let message = `Hello SkyWoven-Clothes™ Admin,\n\nI want to place an order:\n\n*Customer Details:*\nName: ${name}\nPhone: ${phone}\nAddress: ${address}, ${city}\n\n*Order Items:*\n${orderDetailsText}\n\nKindly confirm my order!`;
            let whatsappUrl = `https://wa.me/923112231296?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
