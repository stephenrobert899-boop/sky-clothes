<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Clothes | Official Store</title>
    <!-- Font Awesome Icons for Search, User, Heart, Cart -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Top Announcement Bar */
        .top-bar {
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 8px 15px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Main Header */
        header {
            border-bottom: 1px solid #e5e5e5;
            background-color: #fff;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1400px;
            margin: 0 auto;
            padding: 15px 30px;
        }

        /* Brand Logo */
        .logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #000;
            text-decoration: none;
        }

        /* Search Bar */
        .search-box {
            position: relative;
            width: 40%;
            max-width: 500px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 40px 10px 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
            background-color: #f8f8f8;
        }

        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #555;
            cursor: pointer;
        }

        /* Navigation Icons */
        .user-actions {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .user-actions a {
            color: #000;
            text-decoration: none;
            font-size: 18px;
            position: relative;
        }

        /* Main Navigation Bar */
        nav {
            border-top: 1px solid #f0f0f0;
            background-color: #fff;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            list-style: none;
            padding: 12px 0;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: #000;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #555;
            border-bottom: 2px solid #000;
            padding-bottom: 3px;
        }

        /* Hero Banner Section */
        .hero {
            position: relative;
            width: 100%;
            height: 75vh;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), 
                        url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
        }

        .hero-content h1 {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }

        .hero-content p {
            font-size: 18px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .shop-btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #fff;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 2px;
            transition: background 0.3s, color 0.3s;
        }

        .shop-btn:hover {
            background-color: #000;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Top Announcement Bar -->
    <div class="top-bar">
        FREE DELIVERY ON ORDERS OVER RS. 3000 | SHOP NEW ARRIVALS
    </div>

    <!-- Main Header -->
    <header>
        <div class="header-container">
            <a href="#" class="logo">SKY CLOTHES</a>
            
            <div class="search-box">
                <input type="text" placeholder="Search for anything here...">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>

            <div class="user-actions">
                <a href="#" title="Account"><i class="fa-regular fa-user"></i></a>
                <a href="#" title="Wishlist"><i class="fa-regular fa-heart"></i></a>
                <a href="#" title="Shopping Bag"><i class="fa-solid fa-bag-shopping"></i></a>
            </div>
        </div>

        <!-- Category Menu -->
        <nav>
            <ul class="nav-links">
                <li><a href="#">Women</a></li>
                <li><a href="#">Men</a></li>
                <li><a href="#">Boys</a></li>
                <li><a href="#">Girls</a></li>
                <li><a href="#">Kids</a></li>
                <li><a href="#">New In</a></li>
                <li><a href="#">Brands</a></li>
                <li><a href="#">Clearance</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Hero Banner -->
    <section class="hero">
        <div class="hero-content">
            <h1>READY FOR SCHOOL & BEYOND</h1>
            <p>Explore the new season collection now</p>
            <a href="#" class="shop-btn">Shop Now</a>
        </div>
    </section>

</body>
</html>
